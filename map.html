<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report a problem - Map</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <style>
        body { overflow: hidden; }
        .map-page { display:flex; height:100vh; }
        .map-left { flex:1; position:relative; }
        .map-right { width:360px; border-left:1px solid #eee; overflow-y:auto; background:#fff; padding:16px; }
        #map { height:100%; }
        .type-grid { display:flex; gap:8px; flex-wrap:wrap; }
        .type-btn { width:64px; height:64px; border-radius:8px; border:2px solid transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; }
        .type-btn.selected { outline:3px solid #333; transform:translateY(-4px); }
        .controls { margin-top:12px; }
        .location-hint { margin-top:8px; font-size:0.9rem; color:#555; }
        .color-preview { width:48px; height:48px; border-radius:6px; display:inline-block; vertical-align:middle; margin-left:8px; border:1px solid #ddd; }
    </style>
</head>
<body>
    <div class="map-page">
        <div class="map-left">
            <div id="map"></div>
        </div>
        <div class="map-right">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin:0">Select Type of Issue</h3>
                <a href="index.html" style="text-decoration:none;color:#007bff;">Back</a>
            </div>

            <div class="type-grid" id="typeGrid" style="margin-top:12px;">
                <!-- buttons inserted by map.js -->
            </div>

            <div class="controls">
                <label style="font-weight:700; display:block; margin-top:12px;">Location</label>
                <div style="margin-top:8px;">
                    <button id="useCurrentBtn">Use current location</button>
                    <button id="enableDragBtn">Select location (drag pin)</button>
                </div>
                <div class="location-hint" id="latlngDisplay">No location selected</div>
            </div>

            <div style="margin-top:12px;">
                <label style="font-weight:700; display:block;">Title</label>
                <input id="title" type="text" placeholder="Short title" style="width:100%; padding:8px; margin-top:6px;" />
                <label style="font-weight:700; display:block; margin-top:8px;">Description</label>
                <textarea id="desc" rows="4" style="width:100%; padding:8px; margin-top:6px;"></textarea>
                <label style="font-weight:700; display:block; margin-top:8px;">Your name (optional)</label>
                <input id="reporter" type="text" style="width:100%; padding:8px; margin-top:6px;" />
                <div style="margin-top:12px; display:flex; gap:8px; align-items:center;">
                    <button id="submitBtn" style="flex:1;">Submit report</button>
                    <div id="previewLabel" style="font-size:0.9rem; color:#333;">Preview</div>
                    <div id="colorPreview" class="color-preview"></div>
                </div>
                <div id="submitMsg" style="margin-top:12px; color:green; display:none;">Report saved locally.</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="map.js"></script>
</body>
</html>
